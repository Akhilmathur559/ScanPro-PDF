name: Build ScanPro PDF APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key cache (fallback only)
        if: ${{ secrets.SCANPRO_DEBUG_KEYSTORE_BASE64 == '' }}
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: scanpro-debug-signing-key-v1
      - name: Set up persistent signing key from repository secret
        if: ${{ secrets.SCANPRO_DEBUG_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SCANPRO_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Ensure signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK signing certificate
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --print-certs "$APK"
      - name: Save signing certificate fingerprint
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --print-certs "$APK" | tee signing-certificate.txt
      - name: Upload signing fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: ScanPro-PDF-signing-fingerprint
          path: signing-certificate.txt
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScanPro-PDF-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
